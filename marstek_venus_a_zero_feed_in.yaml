###############################################################################
# Marstek Venus A – Nulleinspeisung (Zero Feed-In) Blueprint
#
# Controls a Marstek Venus A battery storage via Modbus integration
# to achieve zero grid feed-in. Uses a power meter (e.g. Shelly Pro3 EM)
# at the grid connection point and automatically adjusts charge/discharge
# power so that minimal or no power is exported to the grid.
#
# Control algorithm overview (proportional controller with dead band):
#   1. Read grid power (positive = import, negative = export)
#   2. Read current battery command values (discharge/charge power settings)
#   3. Compute "current_net" = discharge_setting - charge_setting
#      (positive = battery discharging, negative = battery charging)
#   4. If grid is outside the dead band [target - tolerance, target + tolerance]:
#        new_net = current_net + grid - target
#      This adjusts battery power to bring grid towards the target import.
#   5. Split new_net into discharge (if > 0) or charge (if < 0) targets
#   6. Apply SOC limits, power limits, ramp-up for discharge
#   7. Set power values and force mode via Modbus
#
# Debugging:
#   - All key variables appear in Home Assistant automation traces
#   - A "debug_message" variable summarizes each cycle for easy trace analysis
#   - system_log.write entries are created for mode changes and errors
###############################################################################

blueprint:
  name: "Marstek Venus A – Nulleinspeisung (Zero Feed-In)"
  description: >
    Steuert den Marstek Venus A Batteriespeicher via Modbus-Integration für eine
    Nulleinspeisung. Nutzt einen Leistungsmesser (z.B. Shelly Pro3 EM) zur Messung
    der Netzleistung und regelt die Entladeleistung automatisch, sodass möglichst
    kein Strom ins Netz eingespeist wird. PV-Überschuss wird automatisch über den
    MPPT des Geräts in die Batterie geleitet – unabhängig vom Force Mode.


    Funktionen:

    - Automatische Nulleinspeisung (aktivierbar/deaktivierbar)

    - Manuelle Einspeisungssteuerung mit einstellbarer Leistung

    - Maximale Einspeisung (Max-Ertrag): PV-Leistung wird direkt durchgereicht,
      der Speicher wird ab einem einstellbaren SOC gezielt leergefahren, damit
      für den nächsten PV-Überschuss wieder Platz ist

    - Einstellbarer minimaler Netzbezug

    - Einstellbare Totband-Toleranz um den Ziel-Netzbezug

    - Einstellbare maximale Lade- und Entladeleistung

    - Einstellbarer minimaler und maximaler SOC

    - Entladeverzögerung zur Unterdrückung kurzer Lastspitzen

    - Schrittweise Entladung (Rampe) zum Schutz der Hardware

    - SOC-Recovery: Notladen aus dem Netz, wenn Batterie kritisch leer

    - PV-Passthrough: Wenn Batterie voll (SOC ≥ max. SOC) und PV aktiv, wird
      PV-Leistung automatisch über den Wechselrichter ins Haus/Netz geleitet


    Voraussetzungen:

    - Marstek Venus A mit Modbus-Integration
      (https://github.com/ViperRNMC/marstek_venus_modbus)

    - Leistungsmesser am Netzanschluss (z.B. Shelly Pro3 EM)

    - PV-Eingangsleistungs-Sensor (Solarleistung)

    - Vier Input-Boolean-Helfer (Nulleinspeisung ein/aus, Manuelle Einspeisung ein/aus,
      Maximale Einspeisung ein/aus, Statushelfer "Speicher wird leergefahren")

    - Ein Input-Number-Helfer für die manuelle Entladeleistung


    Hinweis zum Netzleistungs-Sensor:
    Positive Werte = Netzbezug (Import), Negative Werte = Netzeinspeisung (Export).
    Dies ist der Standard bei Shelly-Geräten.
  domain: automation
  input:
    grid_power_sensor:
      name: "Netzleistung Sensor"
      description: >
        Sensor für die aktuelle Netzleistung (z.B. Shelly Pro3 EM).
        Positiv = Netzbezug, Negativ = Netzeinspeisung.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: power

    pv_power_sensor:
      name: "PV-Eingangsleistung Sensor"
      description: >
        Sensor für die aktuelle PV-Eingangsleistung (Solarleistung) in Watt.
        Wird benötigt, um zu bestimmen, ob PV-Überschuss vorhanden ist
        und der Force Mode korrekt auf 'laden' gesetzt werden soll.
        Hinweis: Wenn dieser Sensor nachts 'unavailable' wird, funktioniert
        die Nulleinspeisung trotzdem weiter (PV wird dann als 0 W behandelt).
      selector:
        entity:
          filter:
            domain: sensor
            device_class: power

    battery_soc_sensor:
      name: "Batterie-Ladezustand (SOC)"
      description: "Sensor für den aktuellen Batterie-Ladezustand in Prozent."
      selector:
        entity:
          filter:
            domain: sensor
            device_class: battery

    discharge_power_number:
      name: "Entladeleistung einstellen"
      description: >
        Number-Entity zum Einstellen der Entladeleistung des Marstek Venus A
        (z.B. number.marstek_venus_modbus_entladeleistung_einstellen).
      selector:
        entity:
          filter:
            domain: number

    charge_power_number:
      name: "Ladeleistung einstellen"
      description: >
        Number-Entity zum Einstellen der Ladeleistung des Marstek Venus A
        (z.B. number.marstek_venus_modbus_ladeleistung_einstellen).
      selector:
        entity:
          filter:
            domain: number

    zero_feed_in_enabled:
      name: "Nulleinspeisung aktivieren"
      description: >
        Input Boolean zum Aktivieren/Deaktivieren der automatischen Nulleinspeisung.
        Erstellen Sie dazu einen Helfer (input_boolean) in Home Assistant.
      selector:
        entity:
          filter:
            domain: input_boolean

    manual_feed_in_enabled:
      name: "Manuelle Einspeisung aktivieren"
      description: >
        Input Boolean zum Aktivieren der manuellen Einspeisung.
        Wenn aktiv, wird die eingestellte manuelle Leistung verwendet.
        Hat Vorrang vor der automatischen Nulleinspeisung.
      selector:
        entity:
          filter:
            domain: input_boolean

    manual_discharge_power:
      name: "Manuelle Entladeleistung"
      description: >
        Input Number für die gewünschte manuelle Entladeleistung in Watt.
        Wird nur verwendet, wenn die manuelle Einspeisung aktiviert ist.
      selector:
        entity:
          filter:
            domain: input_number

    max_yield_enabled:
      name: "Maximale Einspeisung aktivieren"
      description: >
        Input Boolean zum Aktivieren der maximalen Einspeisung (Max-Ertrag).
        Statt den Netzbezug zu regeln, wird die PV-Leistung direkt über den
        Wechselrichter durchgereicht (gedeckelt auf die max. Entladeleistung).
        Nur der Überschuss oberhalb dieser Grenze landet über den MPPT im Speicher.
        Ist der Speicher gefüllt oder ist es Nacht, wird mit voller Entladeleistung
        entladen, damit für den nächsten PV-Überschuss wieder Platz ist.
        Sinnvoll bei kleinem Speicher und begrenzter AC-Ausgangsleistung (z.B. 800 W).
        Hat Vorrang vor der automatischen Nulleinspeisung, aber nicht vor der
        manuellen Einspeisung.
      selector:
        entity:
          filter:
            domain: input_boolean

    dump_active_helper:
      name: "Helfer: Speicher wird leergefahren"
      description: >
        Input Boolean, in dem der Modus "Maximale Einspeisung" speichert, ob er
        den Speicher gerade gezielt leerfährt. Wird benötigt, weil ein Blueprint
        selbst kein Gedächtnis über einzelne Durchläufe hinweg hat.
        Die Automatisierung schaltet diesen Helfer selbstständig ein und aus –
        er muss nur einmal als Helfer angelegt werden.
        Wird nur im Modus "Maximale Einspeisung" verwendet.
      selector:
        entity:
          filter:
            domain: input_boolean

    dump_start_soc:
      name: "Leerfahren ab SOC (%)"
      description: >
        Nur für den Modus "Maximale Einspeisung": Erreicht der Ladezustand diesen
        Wert, wird der Speicher mit voller Entladeleistung leergefahren – bis
        hinunter zu "Leerfahren bis SOC". So ist nach einer Verschattungsphase
        wieder Platz für den nächsten PV-Überschuss, statt dass der Wechselrichter
        drosseln muss.
        Auf 0 setzen, um das Leerfahren zu deaktivieren (dann wird nur die
        PV-Leistung durchgereicht).
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    dump_stop_soc:
      name: "Leerfahren bis SOC (%)"
      description: >
        Nur für den Modus "Maximale Einspeisung": Bis zu diesem Ladezustand wird
        der Speicher leergefahren, danach wird wieder nur die PV-Leistung
        durchgereicht. Höhere Werte = weniger Zyklen, aber auch weniger Puffer.
        Werte unterhalb des minimalen SOC werden automatisch auf diesen angehoben.
      default: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    min_grid_import:
      name: "Minimaler Netzbezug (W)"
      description: >
        Minimale Leistung in Watt, die immer aus dem Netz bezogen werden soll.
        Bei 0 wird der Netzbezug auf nahezu Null geregelt.
        Werte > 0 stellen sicher, dass mindestens dieser Wert importiert wird.
      default: 0
      selector:
        number:
          min: 0
          max: 500
          step: 10
          unit_of_measurement: "W"
          mode: slider

    dead_band:
      name: "Totband (W)"
      description: >
        Symmetrische Toleranz um den Ziel-Netzbezug (min_grid_import).
        Solange der Netzbezug innerhalb von [Ziel - Totband, Ziel + Totband] liegt,
        wird keine Anpassung vorgenommen. Kleinere Werte = engere Regelung,
        größere Werte = weniger häufige Modbus-Schreibzugriffe.
      default: 10
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "W"
          mode: slider

    max_discharge_power:
      name: "Maximale Entladeleistung (W)"
      description: "Maximale Entladeleistung der Batterie in Watt."
      default: 800
      selector:
        number:
          min: 0
          max: 800
          step: 1
          unit_of_measurement: "W"
          mode: slider

    max_charge_power:
      name: "Maximale Ladeleistung (W)"
      description: "Maximale Ladeleistung der Batterie in Watt."
      default: 800
      selector:
        number:
          min: 0
          max: 1200
          step: 1
          unit_of_measurement: "W"
          mode: slider

    min_soc:
      name: "Minimaler SOC (%)"
      description: >
        Minimaler Batterie-Ladezustand in Prozent.
        Unterhalb dieses Wertes wird die Batterie nicht entladen.
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    max_soc:
      name: "Maximaler SOC (%)"
      description: >
        Maximaler Batterie-Ladezustand in Prozent.
        Oberhalb dieses Wertes wird die Batterie nicht mehr geladen.
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    recovery_soc:
      name: "Recovery SOC (%)"
      description: >
        Wenn der Batterie-Ladezustand auf oder unter diesen Wert fällt, erzwingt
        der Regler das Laden mit max_charge_power – auch aus dem Netz – bis der
        SOC wieder min_soc erreicht. Auf 0 setzen zum Deaktivieren (Standard).
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    discharge_delay:
      name: "Entladeverzögerung (s)"
      description: >
        Wartezeit in Sekunden, bevor die Entladung aus dem Ruhezustand gestartet wird.
        Filtert kurze Lastspitzen heraus. Die Entladung beginnt erst, wenn der
        erhöhte Netzbezug für diese Dauer anhält.
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "s"
          mode: slider

    discharge_step:
      name: "Entlade-Schrittweite (W)"
      description: >
        Maximale Erhöhung der Entladeleistung pro Regelzyklus in Watt.
        Verhindert, dass die Batterie sofort mit voller Leistung entlädt.
        Beispiel: Bei 200 W steigt die Entladung schrittweise
        (0 → 200 → 400 → 600 → 800 W).
      default: 200
      selector:
        number:
          min: 1
          max: 400
          step: 1
          unit_of_measurement: "W"
          mode: slider

    force_mode_select:
      name: "Force Mode Auswahl"
      description: >
        Select-Entity für den Force Mode des Marstek Venus (Modbus).
        Mögliche Werte: stop (Stopp), charge (Laden), discharge (Entladen).
        Standard-Entity: select.marstek_venus_modbus_force_mode
      selector:
        entity:
          filter:
            domain: select

# Only one instance of this automation runs at a time.
# If a new trigger fires while the automation is still running, it is silently
# ignored (no warning in the log). This prevents overlapping Modbus writes.
mode: single
max_exceeded: silent

###############################################################################
# Variables – store all input references for use in Jinja2 templates
###############################################################################
variables:
  # Entity IDs (resolved from blueprint inputs at instantiation time)
  grid_power_entity: !input grid_power_sensor
  pv_power_entity: !input pv_power_sensor
  soc_entity: !input battery_soc_sensor
  discharge_entity: !input discharge_power_number
  charge_entity: !input charge_power_number
  zero_feed_in_entity: !input zero_feed_in_enabled
  manual_feed_in_entity: !input manual_feed_in_enabled
  manual_power_entity: !input manual_discharge_power
  max_yield_entity: !input max_yield_enabled
  dump_helper_entity: !input dump_active_helper
  force_mode_entity: !input force_mode_select
  # Numeric configuration values
  dump_start_soc_value: !input dump_start_soc
  dump_stop_soc_value: !input dump_stop_soc
  min_grid_import_value: !input min_grid_import
  dead_band_value: !input dead_band
  max_discharge_value: !input max_discharge_power
  max_charge_value: !input max_charge_power
  min_soc_value: !input min_soc
  max_soc_value: !input max_soc
  recovery_soc_value: !input recovery_soc
  discharge_delay_value: !input discharge_delay
  discharge_step_value: !input discharge_step

###############################################################################
# Triggers
###############################################################################
trigger:
  # React immediately when the grid power reading changes
  - trigger: state
    entity_id: !input grid_power_sensor
  # React immediately when the PV reading changes. The max-yield mode follows PV
  # directly and ignores the grid sensor, so it needs its own trigger.
  - trigger: state
    entity_id: !input pv_power_sensor
  # Periodic fallback: run every 10 seconds even if no state change occurs
  - trigger: time_pattern
    seconds: "/10"
  # When the user turns OFF zero-feed-in, we need to stop the battery
  - trigger: state
    entity_id: !input zero_feed_in_enabled
    to: "off"
    id: "zero_feed_in_off"
  # When the user turns OFF manual feed-in, we need to stop the battery
  - trigger: state
    entity_id: !input manual_feed_in_enabled
    to: "off"
    id: "manual_feed_in_off"
  # When the user turns OFF max-yield mode, we need to stop the battery
  - trigger: state
    entity_id: !input max_yield_enabled
    to: "off"
    id: "max_yield_off"

###############################################################################
# Conditions – the automation only runs if at least one mode is active
# OR the trigger was an explicit "turn off" of a mode toggle
###############################################################################
condition:
  - condition: or
    conditions:
      # Run if zero-feed-in is enabled
      - condition: state
        entity_id: !input zero_feed_in_enabled
        state: "on"
      # Run if manual feed-in is enabled
      - condition: state
        entity_id: !input manual_feed_in_enabled
        state: "on"
      # Run if max-yield mode is enabled
      - condition: state
        entity_id: !input max_yield_enabled
        state: "on"
      # Run if the trigger was one of the mode toggles being turned off
      # (so we can execute the "default" stop action)
      - condition: trigger
        id:
          - zero_feed_in_off
          - manual_feed_in_off
          - max_yield_off
  # The SOC sensor must always be available – every mode depends on it.
  # The grid sensor is only required by the zero-feed-in controller; the manual
  # and max-yield modes never read it, so an unavailable grid sensor must not
  # block them.
  # PV sensor is NOT required here – it may be unavailable at night when the
  # solar inverter is off. The templates treat unavailable PV as 0 W.
  # This is a critical fix: previously, an unavailable PV sensor blocked the
  # entire automation, preventing battery discharge at night.
  - condition: template
    value_template: >
      {{ states(soc_entity) not in ['unknown', 'unavailable'] and
         (states(grid_power_entity) not in ['unknown', 'unavailable'] or
          is_state(manual_feed_in_entity, 'on') or
          is_state(max_yield_entity, 'on')) }}

###############################################################################
# Actions – choose between manual feed-in, zero feed-in, or stop (default)
###############################################################################
action:
  - choose:
      #####################################################################
      # Branch 1: MANUAL FEED-IN (has priority over zero feed-in)
      # Discharges the battery at a user-specified fixed power level.
      #####################################################################
      - conditions:
          - condition: state
            entity_id: !input manual_feed_in_enabled
            state: "on"
        sequence:
          - variables:
              # Read the user's desired manual discharge power (W)
              manual_power: "{{ states(manual_power_entity) | float(0) }}"
              # Current battery state of charge (%)
              soc: "{{ states(soc_entity) | float(0) }}"
              # Calculate effective discharge:
              # - If SOC is at or below minimum, do not discharge (protect battery)
              # - Otherwise, use manual power capped at the configured maximum
              effective_discharge: >
                {%- if soc <= min_soc_value | float(0) -%}
                  {{ 0 }}
                {%- else -%}
                  {{ [manual_power, max_discharge_value | float(0)] | min }}
                {%- endif -%}
              # Determine the force mode based on effective discharge
              force_mode_option: >
                {%- if effective_discharge | float(0) > 0 -%}
                  discharge
                {%- else -%}
                  stop
                {%- endif -%}
              # Debug summary visible in HA automation traces
              debug_message: >
                MANUAL: SOC={{ soc }}%, manual_power={{ manual_power }}W,
                effective_discharge={{ effective_discharge }}W,
                force_mode={{ force_mode_option }}

          # Log the action for debugging
          - action: system_log.write
            data:
              message: "Nulleinspeisung [MANUAL]: {{ debug_message }}"
              level: debug
              logger: "blueprint.marstek_nulleinspeisung"

          # Set charge power to 0 (manual mode only discharges)
          - action: number.set_value
            target:
              entity_id: "{{ charge_entity }}"
            data:
              value: 0

          # Set the discharge power
          - action: number.set_value
            target:
              entity_id: "{{ discharge_entity }}"
            data:
              value: "{{ effective_discharge | round(0) | int }}"

          # Set the force mode (discharge or stop)
          - action: select.select_option
            target:
              entity_id: "{{ force_mode_entity }}"
            data:
              option: "{{ force_mode_option }}"

      #####################################################################
      # Branch 2: MAXIMUM FEED-IN / MAX YIELD (Maximale Einspeisung)
      #
      # For setups where every kWh leaving the AC port is worth the same
      # (feed-in tariff, small battery, hard AC output limit). The goal is not
      # to regulate the grid, but to maximise the energy pushed through the
      # inverter and to keep headroom in the battery for the next PV peak.
      #
      #   day, battery not full  -> output = PV power (capped at max discharge)
      #                             lossless pass-through, MPPT stores only the
      #                             surplus above the cap
      #   battery above          -> output = max discharge, LATCHED until
      #   dump_start_soc            dump_stop_soc, so headroom is restored
      #   night (PV = 0)         -> output = max discharge, down to min_soc
      #
      # The latch state lives in an input_boolean helper: a blueprint has no
      # memory across runs, and it cannot be derived from the commanded
      # discharge power (at PV > cap that value equals max discharge as well,
      # without any dumping going on).
      #####################################################################
      - conditions:
          - condition: state
            entity_id: !input max_yield_enabled
            state: "on"
        sequence:
          - variables:
              # Current PV power; treat unavailable as 0 W. Consistent with the
              # zero-feed-in branch: an offline inverter at night means 0 W, and
              # 0 W is exactly the "night" case handled below.
              pv_power: >
                {% set pv_raw = states(pv_power_entity) %}
                {{ pv_raw | float(0) if pv_raw not in ['unknown', 'unavailable'] else 0 }}
              # Battery state of charge (%)
              soc: "{{ states(soc_entity) | float(0) }}"
              # Currently commanded discharge power (W) – needed for the ramp
              current_discharge: >
                {% set raw = states(discharge_entity) %}
                {{ raw | float(0) if raw not in ['unknown', 'unavailable'] else 0 }}

          - variables:
              # Lower end of the dump run. Never go below the hard discharge
              # limit, so a misconfigured dump_stop_soc cannot bypass min_soc.
              dump_floor: "{{ [dump_stop_soc_value | float(0), min_soc_value | float(0)] | max }}"
              # Latch entry: battery has reached the dump threshold.
              # dump_start_soc = 0 disables the latch entirely.
              dump_start: >
                {{ dump_start_soc_value | float(0) > 0 and
                   soc | float(0) >= dump_start_soc_value | float(0) }}
              # Latch exit: battery is drained far enough
              dump_stop: "{{ soc | float(0) <= dump_floor | float(0) }}"

          - variables:
              # Latched dump state: start on threshold, keep running while the
              # helper is on and we have not reached the floor yet.
              dumping: >
                {{ dump_start or
                   (is_state(dump_helper_entity, 'on') and not dump_stop) }}
              # Target discharge power (W). Order of the rules is binding:
              # the min_soc protection outranks every dump rule.
              discharge_target: >
                {%- if soc | float(0) <= min_soc_value | float(0) -%}
                  {{ 0 }}
                {%- elif dumping or pv_power | float(0) <= 0 or
                         soc | float(0) >= max_soc_value | float(0) -%}
                  {{ max_discharge_value | float(0) }}
                {%- else -%}
                  {{ [pv_power | float(0), max_discharge_value | float(0)] | min }}
                {%- endif -%}

          - variables:
              # Apply ramp-up: limit the increase per cycle by discharge_step.
              # Ramp-down is immediate (same behaviour as zero feed-in).
              ramped_discharge: >
                {%- set target = discharge_target | float(0) -%}
                {%- set current = current_discharge | float(0) -%}
                {%- set step = discharge_step_value | float(0) -%}
                {%- if target > current -%}
                  {{ [target, current + step] | min }}
                {%- else -%}
                  {{ target }}
                {%- endif -%}
              # This mode never charges from the grid – PV surplus is stored by
              # the MPPT on the DC side, independently of the force mode.
              force_mode_option: >
                {%- if ramped_discharge | float(0) > 0 -%}
                  discharge
                {%- else -%}
                  stop
                {%- endif -%}
              # Debug summary for HA trace analysis – all key values in one place
              debug_message: >
                MAX-YIELD: PV={{ pv_power }}W, SOC={{ soc }}%,
                current_D={{ current_discharge }}W,
                dump_start={{ dump_start }}, dump_stop={{ dump_stop }},
                dump_floor={{ dump_floor }}%, dumping={{ dumping }},
                D_target={{ discharge_target }}W, ramped_D={{ ramped_discharge }}W,
                mode={{ force_mode_option }}

          # Log the debug summary for easy troubleshooting
          - action: system_log.write
            data:
              message: "Nulleinspeisung {{ debug_message }}"
              level: debug
              logger: "blueprint.marstek_nulleinspeisung"

          # Persist the latch state, but only when it actually changes –
          # this automation runs every 10 s and we do not want to churn the
          # helper's state history.
          - if:
              - condition: template
                value_template: "{{ dumping and not is_state(dump_helper_entity, 'on') }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ dump_helper_entity }}"
          - if:
              - condition: template
                value_template: "{{ not dumping and not is_state(dump_helper_entity, 'off') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ dump_helper_entity }}"

          # Zero out charge power first, then set the discharge power
          - action: number.set_value
            target:
              entity_id: "{{ charge_entity }}"
            data:
              value: 0
          - action: number.set_value
            target:
              entity_id: "{{ discharge_entity }}"
            data:
              value: "{{ ramped_discharge | round(0) | int }}"

          # Set the force mode last – the power values are already set correctly
          - action: select.select_option
            target:
              entity_id: "{{ force_mode_entity }}"
            data:
              option: "{{ force_mode_option }}"

      #####################################################################
      # Branch 3: AUTOMATIC ZERO FEED-IN (Nulleinspeisung)
      # Calculates the optimal battery power to keep grid import at the
      # configured target (min_grid_import) with minimal export.
      #####################################################################
      - conditions:
          - condition: state
            entity_id: !input zero_feed_in_enabled
            state: "on"
        sequence:
          ############################
          # Step 1: Read current state
          ############################
          - variables:
              # Current grid power: positive = import, negative = export (W)
              grid: "{{ states(grid_power_entity) | float(0) }}"
              # Current PV power; treat unavailable as 0 W (safe for nighttime)
              pv_power: >
                {% set pv_raw = states(pv_power_entity) %}
                {{ pv_raw | float(0) if pv_raw not in ['unknown', 'unavailable'] else 0 }}
              # Battery state of charge (%)
              soc: "{{ states(soc_entity) | float(0) }}"
              # Current commanded discharge power from the Modbus entity (W)
              # This is the last value we set, not the actual battery output.
              # We treat unavailable as 0 to avoid stale values causing issues.
              current_discharge: >
                {% set raw = states(discharge_entity) %}
                {{ raw | float(0) if raw not in ['unknown', 'unavailable'] else 0 }}
              # Current commanded charge power from the Modbus entity (W)
              current_charge: >
                {% set raw = states(charge_entity) %}
                {{ raw | float(0) if raw not in ['unknown', 'unavailable'] else 0 }}

          #######################################
          # Step 2: Calculate new battery targets
          #######################################
          - variables:
              # Net battery power: positive = discharging, negative = charging
              # This represents what we last told the battery to do.
              current_net: "{{ current_discharge | float(0) - current_charge | float(0) }}"
              # Target grid import power (W) – the setpoint for the controller
              target_import: "{{ min_grid_import_value | float(0) }}"
              # Configurable tolerance for the dead band (W); defaults to 10
              tolerance: "{{ dead_band_value | float(10) }}"
              # Dead band boundaries:
              # lower_bound = target - tolerance  (symmetric around target)
              # upper_bound = target + tolerance
              # When grid is within [lower_bound, upper_bound], no adjustment is made.
              # Using symmetric tolerance prevents the dead band from becoming too
              # wide, which could cause the discharge to stay stuck at a high value
              # when the load drops suddenly.
              lower_bound: "{{ target_import | float(0) - tolerance }}"
              upper_bound: "{{ target_import | float(0) + tolerance }}"
              # Calculate the new desired net battery power.
              # Formula: new_net = current_net + grid - target
              # Intuition: if grid > target (importing too much), increase discharge.
              #            if grid < lower_bound (exporting too much), increase charge.
              #            if grid is within dead band, keep current setting.
              new_net: >
                {%- set g = grid | float(0) -%}
                {%- set net = current_net | float(0) -%}
                {%- set lo = lower_bound | float(0) -%}
                {%- set hi = upper_bound | float(0) -%}
                {%- if g > hi or g < lo -%}
                  {{ net + g - target_import | float(0) }}
                {%- else -%}
                  {{ net }}
                {%- endif -%}
              # Discharge target: how much to discharge (W), 0 if net <= 0
              # Respects SOC minimum and max discharge power limits.
              # PV pass-through failsafe: when battery is full (SOC >= max_soc) and
              # PV is producing, discharge at PV power to protect battery and allow
              # solar energy to flow to house/grid via the AC inverter.
              discharge_target: >
                {%- if soc | float(0) >= max_soc_value | float(0) and pv_power | float(0) > 0 -%}
                  {{ [pv_power | float(0), max_discharge_value | float(0)] | min }}
                {%- else -%}
                  {%- set net = new_net | float(0) -%}
                  {%- if net > 0 -%}
                    {%- if soc | float(0) <= min_soc_value | float(0) -%}
                      {{ 0 }}
                    {%- else -%}
                      {{ [net, max_discharge_value | float(0)] | min }}
                    {%- endif -%}
                  {%- else -%}
                    {{ 0 }}
                  {%- endif -%}
                {%- endif -%}
              # Charge target: how much to charge (W), 0 if net >= 0
              # Respects SOC maximum and max charge power limits.
              # Recovery branch: if SOC <= recovery_soc, force-charge at max power
              # (even from grid), until SOC reaches min_soc.
              charge_target: >
                {%- set rec = recovery_soc_value | float(0) -%}
                {%- set s = soc | float(0) -%}
                {%- if rec > 0 and s <= rec -%}
                  {{ max_charge_value | float(0) }}
                {%- else -%}
                  {%- set net = new_net | float(0) -%}
                  {%- if net < 0 -%}
                    {%- if s >= max_soc_value | float(0) -%}
                      {{ 0 }}
                    {%- else -%}
                      {{ [net | abs, max_charge_value | float(0)] | min }}
                    {%- endif -%}
                  {%- else -%}
                    {{ 0 }}
                  {%- endif -%}
                {%- endif -%}
              # Detect if we are starting a discharge from a completely idle state.
              # If so, we will apply the discharge delay to filter short load spikes.
              starting_discharge: >
                {{ discharge_target | float(0) > 0 and
                   current_discharge | float(0) == 0 and
                   current_charge | float(0) == 0 }}

          ############################################################
          # Step 3: Discharge delay – wait before starting a discharge
          # from idle state to filter transient load spikes
          ############################################################
          - if:
              - condition: template
                value_template: "{{ starting_discharge }}"
            then:
              - delay:
                  seconds: "{{ discharge_delay_value | int(0) }}"

          ##############################################################
          # Step 4: Re-read sensor values after the delay (if any).
          # The grid power and battery state may have changed during the
          # delay, so we recalculate everything with fresh data.
          ##############################################################
          - variables:
              # Fresh grid power reading after potential delay
              grid_current: "{{ states(grid_power_entity) | float(0) }}"
              # Fresh SOC reading
              soc_current: "{{ states(soc_entity) | float(0) }}"
              # Fresh PV power reading (treat unavailable as 0)
              pv_current: >
                {% set pv_raw = states(pv_power_entity) %}
                {{ pv_raw | float(0) if pv_raw not in ['unknown', 'unavailable'] else 0 }}
              # Fresh commanded discharge power (treat unavailable as 0)
              current_discharge_actual: >
                {% set raw = states(discharge_entity) %}
                {{ raw | float(0) if raw not in ['unknown', 'unavailable'] else 0 }}
              # Fresh commanded charge power (treat unavailable as 0)
              current_charge_actual: >
                {% set raw = states(charge_entity) %}
                {{ raw | float(0) if raw not in ['unknown', 'unavailable'] else 0 }}

          #################################################
          # Step 5: Recalculate targets with fresh data
          #################################################
          - variables:
              # Recalculate net battery power with fresh values
              current_net_actual: "{{ current_discharge_actual | float(0) - current_charge_actual | float(0) }}"
              # Recalculate new_net with fresh grid reading
              new_net_final: >
                {%- set g = grid_current | float(0) -%}
                {%- set net = current_net_actual | float(0) -%}
                {%- set lo = lower_bound | float(0) -%}
                {%- set hi = upper_bound | float(0) -%}
                {%- if g > hi or g < lo -%}
                  {{ net + g - target_import | float(0) }}
                {%- else -%}
                  {{ net }}
                {%- endif -%}
              # Final discharge target with fresh SOC.
              # PV pass-through failsafe: when battery is full (SOC >= max_soc) and
              # PV is producing, discharge at PV power to protect battery.
              discharge_target_final: >
                {%- if soc_current | float(0) >= max_soc_value | float(0) and pv_current | float(0) > 0 -%}
                  {{ [pv_current | float(0), max_discharge_value | float(0)] | min }}
                {%- else -%}
                  {%- set net = new_net_final | float(0) -%}
                  {%- if net > 0 -%}
                    {%- if soc_current | float(0) <= min_soc_value | float(0) -%}
                      {{ 0 }}
                    {%- else -%}
                      {{ [net, max_discharge_value | float(0)] | min }}
                    {%- endif -%}
                  {%- else -%}
                    {{ 0 }}
                  {%- endif -%}
                {%- endif -%}
              # Final charge target with fresh SOC
              charge_target_final: >
                {%- set rec = recovery_soc_value | float(0) -%}
                {%- set s = soc_current | float(0) -%}
                {%- if rec > 0 and s <= rec -%}
                  {{ max_charge_value | float(0) }}
                {%- else -%}
                  {%- set net = new_net_final | float(0) -%}
                  {%- if net < 0 -%}
                    {%- if s >= max_soc_value | float(0) -%}
                      {{ 0 }}
                    {%- else -%}
                      {{ [net | abs, max_charge_value | float(0)] | min }}
                    {%- endif -%}
                  {%- else -%}
                    {{ 0 }}
                  {%- endif -%}
                {%- endif -%}
              # Apply ramp-up to discharge: limit increase per cycle by discharge_step.
              # Ramp-down is immediate (no step limit when reducing discharge).
              ramped_discharge: >
                {%- set target = discharge_target_final | float(0) -%}
                {%- set current = current_discharge_actual | float(0) -%}
                {%- set step = discharge_step_value | float(0) -%}
                {%- if target > current -%}
                  {{ [target, current + step] | min }}
                {%- else -%}
                  {{ target }}
                {%- endif -%}
              # Determine force mode:
              # - "charge" ONLY when recovery is active (SOC critically low):
              #   forces AC-side grid charging; PV surplus is handled automatically
              #   by the MPPT (DC side) regardless of force mode.
              # - "discharge" if we have a positive discharge target (including PV
              #   pass-through when battery is full)
              # - "stop" otherwise (MPPT continues to charge from PV autonomously)
              force_mode_option: >
                {%- set rec = recovery_soc_value | float(0) -%}
                {%- set recovery_active = rec > 0 and soc_current | float(0) <= rec -%}
                {%- if recovery_active -%}
                  charge
                {%- elif ramped_discharge | float(0) > 0 -%}
                  discharge
                {%- else -%}
                  stop
                {%- endif -%}
              # Debug summary for HA trace analysis – all key values in one place
              debug_message: >
                ZERO-FEED-IN: grid={{ grid_current }}W, PV={{ pv_current }}W,
                SOC={{ soc_current }}%, current_D={{ current_discharge_actual }}W,
                current_C={{ current_charge_actual }}W, net={{ current_net_actual }}W,
                dead_band=[{{ lower_bound }},{{ upper_bound }}],
                new_net={{ new_net_final }}W, D_target={{ discharge_target_final }}W,
                C_target={{ charge_target_final }}W, ramped_D={{ ramped_discharge }}W,
                mode={{ force_mode_option }}

          ###########################################################
          # Step 6: Apply the calculated values to the Marstek Venus
          ###########################################################

          # Log the debug summary for easy troubleshooting
          - action: system_log.write
            data:
              message: "Nulleinspeisung {{ debug_message }}"
              level: debug
              logger: "blueprint.marstek_nulleinspeisung"

          # Set charge power to 0 first when discharging (clean transition)
          # Set discharge power to 0 first when charging (clean transition)
          # This ensures the "opposing" power is zeroed before the new mode takes
          # effect, preventing brief unwanted charge/discharge during transitions.
          - if:
              - condition: template
                value_template: "{{ force_mode_option == 'discharge' }}"
            then:
              # Discharging: zero out charge first, then set discharge
              - action: number.set_value
                target:
                  entity_id: "{{ charge_entity }}"
                data:
                  value: 0
              - action: number.set_value
                target:
                  entity_id: "{{ discharge_entity }}"
                data:
                  value: "{{ ramped_discharge | round(0) | int }}"
            else:
              # Charging or stopping: zero out discharge first, then set charge
              - action: number.set_value
                target:
                  entity_id: "{{ discharge_entity }}"
                data:
                  value: "{{ ramped_discharge | round(0) | int }}"
              - action: number.set_value
                target:
                  entity_id: "{{ charge_entity }}"
                data:
                  value: "{{ charge_target_final | round(0) | int if force_mode_option == 'charge' else 0 }}"

          # Set the force mode last – the power values are already set correctly
          - action: select.select_option
            target:
              entity_id: "{{ force_mode_entity }}"
            data:
              option: "{{ force_mode_option }}"

    ###################################################################
    # Default: STOP – runs when both modes are turned off
    # Resets the battery to idle state (no charging, no discharging)
    ###################################################################
    default:
      - action: system_log.write
        data:
          message: >-
            Nulleinspeisung [STOP]: Both modes disabled, stopping battery.
          level: debug
          logger: "blueprint.marstek_nulleinspeisung"
      - action: number.set_value
        target:
          entity_id: "{{ discharge_entity }}"
        data:
          value: 0
      - action: number.set_value
        target:
          entity_id: "{{ charge_entity }}"
        data:
          value: 0
      - action: select.select_option
        target:
          entity_id: "{{ force_mode_entity }}"
        data:
          option: "stop"
